`<div class="g c8"><h1>Վահանակ · Տնտեսական գործունեության վերլուծություն</h1><p class="sub">Սեղմեք քարտի վրա՝ խնդրին անցնելու համար</p><div class="grid pcg">${T.map((x,i)=>`<div class="g pc" style="padding:14px;border-radius:22px" data-go="${x.id}"><small style="color:var(--mu)">Խնդիր ${i+1}</small><b>${x.t}</b><span class="chip ${i%2?'c':'l'}" style="align-self:flex-start">${ks[i][0]}: ${ks[i][1]}</span></div>`).join('')}</div></div>`}
function view(id){cur=id;history.replaceState(null,'','#'+id);$('#tabs').innerHTML=N.map(n=>`<button class="${n.id==id?'on':''}" data-go="${n.id}">${n.t}</button>`).join('');
if(id=='home'){$('#main').innerHTML=home();return}
const x=T.find(t=>t.id==id);$('#main').innerHTML=`<div class="g c4"><h1>${x.t}</h1><p class="sub">${x.sub}</p><div class="chips">${x.chips.map((c,i)=>`<span class="chip ${i?'c':'l'}">${c}</span>`).join('')}</div>${kp(x)}<div class="concl">${x.concl}</div></div><div class="g c5"><h2>${x.chart.title}</h2><div id="ch">${chart(x.chart,id)}</div></div><div class="g c3"><h2>Հիմնական արդյունքներ</h2>${x.list.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`+(id=='p1'?sim():'');
if(id=='p1'){['X','C'].forEach(k=>$('#'+k).oninput=runSim);runSim()}}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){view(g.dataset.go);return}});
let tipT;
function showTip(e,t){tip.textContent=t.dataset.t;tip.style.display='block';const w=tip.offsetWidth,touch=e.pointerType=='touch';tip.style.left=Math.max(6,Math.min(e.clientX+(touch?-w/2:12),innerWidth-w-6))+'px';tip.style.top=Math.max(6,e.clientY+(touch?-52:14))+'px'}
document.addEventListener('pointermove',e=>{if(e.pointerType=='touch')return;const t=e.target.closest('[data-t]');if(t)showTip(e,t);else tip.style.display='none'});
document.addEventListener('pointerdown',e=>{if(e.pointerType!='touch')return;clearTimeout(tipT);const t=e.target.closest('[data-t]');if(t){showTip(e,t);tipT=setTimeout(()=>tip.style.display='none',2500)}else tip.style.display='none'});

$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');r.dataset.theme=d=='dark'?'light':'dark'};

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function donut(c){const tot=c.values.reduce((a,b)=>a+b,0),R=58,C=2*Math.PI*R;let off=0,o=`<svg viewBox="0 0 300 170" style="max-height:210px"><g transform="translate(85,85) rotate(-90)">`;
c.values.forEach((v,i)=>{const l=v/tot*C;o+=`<circle r="${R}" fill="none" stroke="${c.colors[i]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" data-t="${c.labels[i]}: ${fmt(v,0)} (${(v/tot*100).toFixed(1)}%)"/>`;off+=l});
o+=`</g><text x="85" y="82" text-anchor="middle" style="fill:var(--tx);font-size:15px;font-weight:600">${fmt(tot,0)}</text><text x="85" y="98" text-anchor="middle">հազ. դրամ</text>`;
c.labels.forEach((l,i)=>{o+=`<rect x="170" y="${52+i*26}" width="10" height="10" rx="3" fill="${c.colors[i]}"/><text x="186" y="${61+i*26}" style="font-size:11px">${l}</text><text x="186" y="${72+i*26}" style="font-size:10px;fill:var(--tx)">${(c.values[i]/tot*100).toFixed(1)}%</text>`});return o+'</svg>'}
function wf(c){const v=c.values,n=v.length,MB=isM(),W=MB?340:560,H=250,L=MB?8:14,Tp=22,Bt=34;let run=v[0];const seg=[[0,v[0]]];for(let i=1;i<n-1;i++){seg.push([run,run+v[i]]);run+=v[i]}seg.push([0,v[n-1]]);
const all=seg.flat(),lo0=Math.min(...seg.slice(1,-1).flat(),v[0],v[n-1]),hi=Math.max(...all),pad=(hi-lo0)*.3+1e-9,lo=lo0-pad,y=x=>Tp+(hi+pad*.3-x)/(hi+pad*.3-lo)*(H-Tp-Bt),gw=(W-2*L)/n,bw=gw*.55;let o=`<svg viewBox="0 0 ${W} ${H}">`;
seg.forEach((s,i)=>{const mid=i>0&&i<n-1,col=!mid?'#9aa7c7':(v[i]>=0?'#d4ff3a':'#ff6b70'),a=Math.max(s[0],s[1]),b=Math.min(s[0],s[1]),yt=y(a),h=Math.max(2,y(Math.max(b,lo))-yt),x=L+i*gw+(gw-bw)/2;
o+=`<rect x="${x}" y="${yt}" width="${bw}" height="${h}" rx="8" fill="${col}" opacity=".92" data-t="${c.labels[i]}: ${fmt(v[i],c.dec)}"><animate attributeName="height" from="0" to="${h}" dur=".5s"/></rect><text x="${x+bw/2}" y="${yt-5}" text-anchor="middle" style="fill:var(--tx);font-size:${MB?9.5:11}px">${mid&&v[i]>0?'+':''}${fk(v[i],c.dec)}</text><text x="${x+bw/2}" y="${H-12}" text-anchor="middle">${c.labels[i]}</text>`;
if(i<n-1)o+=`<line x1="${x+bw}" x2="${x+gw}" y1="${y(i==0?v[0]:run0(seg,i))}" y2="${y(i==0?v[0]:run0(seg,i))}" stroke="currentColor" opacity=".25" stroke-dasharray="3 3"/>`});return o+'</svg>'}
function run0(seg,i){return seg[i][1]}
function cw(c,id,k){const body=c.type=='donut'?donut(c):c.type=='wf'?wf(c):chart(c,id+k);return `<div class="chw" data-k="${k}"><h2>${c.title}</h2>${body}</div>`}
function refT(){return `<div class="tw"><table class="rt"><tr>${REF.head.map((h,i)=>`<th class="${i==1?'hl':''}">${h}</th>`).join('')}</tr>${REF.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i==1?'hl':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><p class="sub" style="margin-top:8px">Ստուգման աղյուսակ (Թեմա 3)․ մեր դեպքում Գֆկ = {1;1;1} → առաջին սյուն։</p>`}
function sol(x){return x.items.map(i=>{const c=i.ok===true?'var(--lime)':i.ok===false?'var(--rd)':'var(--cy)';return `<details class="det"><summary><b style="background:${c}">${i.n}</b>${esc(i.ti)}</summary><div class="bd"><pre class="fo">${esc(i.fo)}</pre><pre>${esc(i.ca)}</pre><div class="rs" style="background:${c}">${esc(i.re)}</div><div class="concl" style="border-left-color:${c};margin-top:6px">${esc(i.co)}</div></div></details>`}).join('')}
view=function(id){cur=id;history.replaceState(null,'','#'+id);$('#tabs').innerHTML=N.map(n=>`<button class="${n.id==id?'on':''}" data-go="${n.id}">${n.t}</button>`).join('');
if(id=='home'){$('#main').innerHTML=home()+`<div class="g c6"><h2>${T[0].charts[1].title}</h2>${chart(T[0].charts[1],'h1')}</div><div class="g c6"><h2>${T[3].charts[1].title}</h2>${wf(T[3].charts[1])}</div><div class="g c6">${cw(T[1].charts[2],'h','0')}</div><div class="g c6">${cw(T[4].charts[1],'h5','1')}</div>`;return}
const x=T.find(t=>t.id==id);$('#main').innerHTML=`<div class="g c4"><h1>${x.t}</h1><p class="sub">${x.sub}</p><div class="chips">${x.chips.map((c,i)=>`<span class="chip ${i?'c':'l'}">${c}</span>`).join('')}</div>${kp(x)}<div class="concl">${x.concl}</div></div><div class="c8"><div class="grid">${x.charts.map((c,k)=>`<div class="g ${x.charts.length==3&&k==2?'c12':'c6'}">${cw(c,id,k)}</div>`).join('')}</div></div><div class="g ${id=='p2'?'c5':'c12'}"><h2>Հիմնական արդյունքներ</h2>${x.list.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`+(id=='p2'?`<div class="g c7"><h2>ΔԳ ստուգման աղյուսակ</h2>${refT()}</div>`:'')+`<div class="g c12"><h2>Լուծում՝ կետ առ կետ (սեղմեք կետի վրա)</h2>${sol(x)}</div>`+(id=='p1'?sim():'');
if(id=='p1'){['X','C'].forEach(k=>$('#'+k).oninput=runSim);runSim()}};
