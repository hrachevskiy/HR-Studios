<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Դաս 8 · Դեբիտորական և կրեդիտորական պարտքեր</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300;400;500;600;700;800&family=Noto+Serif+Armenian:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a 16:9 stage deck (scaled to fit) over cinematic footage + a scrolling annual-report style dashboard. Realistic report look, single dark world. */
:root{
  color-scheme: dark;
  --ink:#0f1314;            /* page ground */
  --ink-2:#161c1e;          /* raised surface */
  --ink-3:#1e2629;          /* table zebra / inputs */
  --paper:#ece6da;          /* primary text, warm like report paper */
  --muted:#a7a196;          /* secondary text */
  --faint:#6f6b63;
  --line:rgba(236,230,218,.13);
  --in:#57b386;             /* money in */
  --out:#d56c52;            /* money out */
  --net:#d9ab4f;            /* net / dram gold */
  --info:#7fa7c9;
  --display:'Noto Serif Armenian', 'Sylfaen', Georgia, serif;
  --body:'Noto Sans Armenian', 'Segoe UI', system-ui, sans-serif;
  --num:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--net);outline-offset:3px;border-radius:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-net{color:var(--net)}.c-mut{color:var(--muted)}

/* ---------- top bar ---------- */
.bar{position:fixed;z-index:50;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(10,13,14,.85),rgba(10,13,14,0));pointer-events:none}
.bar>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{font-family:var(--body);font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:11px;margin-right:8px}
.spacer{flex:1}
.seg{display:flex;background:rgba(22,28,30,.8);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.icon-btn{border:1px solid var(--line);background:rgba(22,28,30,.8);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.icon-btn svg{width:16px;height:16px}

/* ---------- deck ---------- */
.deck{position:fixed;inset:0;overflow:hidden;background:#07090a}
.bg{position:absolute;inset:0}
.bg video,.bg .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease, transform 12s linear;transform:scale(1.06)}
.bg video.on{opacity:1;transform:scale(1)}
.bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 20% 30%,rgba(7,9,10,.45),rgba(7,9,10,.88) 70%),
  linear-gradient(to top,rgba(7,9,10,.92),rgba(7,9,10,.2) 55%)}
.deck[data-dim="strong"] .bg::after{background:rgba(9,12,13,.9)}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.stage-wrap{position:absolute;inset:0;display:grid;place-items:center}
.stage{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;padding:96px 110px 90px;display:flex;flex-direction:column;visibility:hidden}
.slide.on{visibility:visible}
.slide [data-a]{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*110ms + 150ms)}
.slide.on [data-a]{opacity:1;transform:none}
.slide.leaving [data-a]{opacity:0;transform:translateY(-14px);transition-duration:.35s;transition-delay:0ms}
.kicker{font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:var(--net);font-weight:600}
.h1{font-family:var(--display);font-weight:800;font-size:96px;line-height:1.02;margin:18px 0 0;text-wrap:balance;letter-spacing:-.01em}
.h2{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.1;margin:10px 0 0;text-wrap:balance}
.lead{font-size:28px;line-height:1.5;color:#d9d3c7;max-width:1050px;margin-top:22px}
.small{font-size:20px;color:var(--muted)}
.foot{position:absolute;left:110px;right:110px;bottom:44px;display:flex;justify-content:space-between;font-size:16px;color:var(--faint);letter-spacing:.04em}
.row{display:flex;gap:32px}
.grow{flex:1;min-width:0}
.card{background:rgba(18,23,25,.78);border:1px solid var(--line);border-radius:18px;padding:28px 30px;backdrop-filter:blur(10px)}
.card h4{margin:0 0 8px;font-size:22px;font-family:var(--display);font-weight:700}
.card p{margin:0;font-size:20px;line-height:1.5;color:#d2ccc0}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.big{font-family:var(--num);font-weight:600;font-size:64px;line-height:1;letter-spacing:-.02em}
.mid{font-family:var(--num);font-weight:600;font-size:40px;line-height:1}
.formula{font-family:var(--display);font-size:34px;font-weight:600;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px 4px}
.frac>span:last-child{padding:4px 8px 0}
.frac sub,.formula sub{font-size:.55em;font-family:var(--body);font-weight:500}
.chart-box{position:relative}
.slide .chart-box canvas{width:100%!important;height:100%!important}

/* specific slides */
.equation{display:flex;align-items:center;gap:26px;margin-top:40px}
.eq-pill{border-radius:20px;padding:26px 34px;min-width:300px;border:1px solid var(--line);background:rgba(18,23,25,.8)}
.eq-pill .lbl{font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eq-pill .val{font-family:var(--num);font-size:46px;font-weight:600;margin-top:6px}
.eq-op{font-family:var(--display);font-size:64px;color:var(--muted)}
.quote{font-family:var(--display);font-size:40px;line-height:1.35;font-weight:600;max-width:1200px;text-wrap:balance}
.quote em{font-style:normal;color:var(--net)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px}
.three .card{display:flex;flex-direction:column;gap:14px}
.three .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:rgba(236,230,218,.07)}
.three .ico svg{width:30px;height:30px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px}
.kpi{padding:26px 26px 22px}
.kpi .lbl{font-size:18px;color:var(--muted);font-weight:600}
.kpi .from{font-family:var(--num);font-size:20px;color:var(--faint);margin-top:14px}
.kpi .to{font-family:var(--num);font-size:46px;font-weight:600;margin-top:2px}
.kpi .delta{display:inline-block;margin-top:12px;font-family:var(--num);font-size:18px;font-weight:600;padding:4px 10px;border-radius:8px}
.up{background:rgba(87,179,134,.15);color:var(--in)}.down{background:rgba(213,108,82,.15);color:var(--out)}
.kpi .spark{height:6px;border-radius:3px;background:rgba(236,230,218,.08);margin-top:18px;overflow:hidden}
.kpi .spark i{display:block;height:100%;border-radius:3px;transform-origin:left;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.2,.7,.2,1) .6s}
.slide.on .kpi .spark i{transform:scaleX(var(--w))}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(18,23,25,.8)}
.toggle button{border:0;background:none;padding:8px 18px;border-radius:999px;font-size:17px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--net);color:#17130a}
.story{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:38px}
.story .card{padding:30px 34px}
.story ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:14px}
.story li{display:flex;gap:14px;font-size:21px;line-height:1.45;color:#d6d0c4}
.story li b{font-family:var(--num);font-weight:600;white-space:nowrap}
.coefs{display:grid;gap:22px;margin-top:34px}
.coef{display:grid;grid-template-columns:1.35fr 1.25fr .9fr;gap:26px;align-items:center;padding:22px 28px}
.coef .nm{font-size:21px;font-weight:600;line-height:1.35}
.coef .nm small{display:block;font-weight:400;color:var(--muted);font-size:17px;margin-top:6px;line-height:1.45}
.coef .fx{font-family:var(--display);font-size:24px}
.coef .fx .frac>span:first-child{border-bottom-width:1.5px}
.coef .vals{display:flex;align-items:baseline;gap:12px;justify-content:flex-end;font-family:var(--num)}
.coef .vals .a{color:var(--faint);font-size:22px}
.coef .vals .b{font-size:36px;font-weight:600}
.chip{font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:8px;white-space:nowrap}
.coefs.compact .nm{font-size:19px}.coefs.compact .nm small{font-size:14.5px;margin-top:3px;line-height:1.35}.coefs.compact .fx{font-size:21px}.coefs.compact .vals .b{font-size:30px}.coefs.compact .chip{font-size:12px}
.turn{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:40px}
.coin-track{height:150px;position:relative;border-radius:18px;background:rgba(236,230,218,.05);border:1px solid var(--line);overflow:hidden;margin-top:16px}
.coin{position:absolute;top:50%;width:60px;height:60px;margin-top:-30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f7dc95,#d9ab4f 45%,#8d6a24 100%);box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 0 0 4px rgba(255,240,200,.25);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#5a4314;font-size:28px;left:20px}
.slide.on .coin{animation:roll var(--t) linear infinite}
@keyframes roll{from{left:20px;transform:rotate(0)}to{left:calc(100% - 80px);transform:rotate(720deg)}}
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin-top:34px}
.recs .card{display:flex;gap:20px;align-items:flex-start}
.recs .n{font-family:var(--display);font-size:44px;font-weight:800;color:var(--net);line-height:1}
.hint{position:absolute;right:110px;bottom:40px;font-size:15px;color:var(--faint);display:flex;gap:16px;align-items:center}
.kbd{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:var(--num);font-size:13px}

/* deck chrome */
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--net);transition:width .6s cubic-bezier(.2,.7,.2,1);z-index:5}
.nav{position:absolute;z-index:6;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  background:rgba(18,23,25,.75);border:1px solid var(--line);border-radius:999px;padding:6px 8px;backdrop-filter:blur(10px)}
.nav button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.nav button:hover{background:rgba(236,230,218,.08)}
.nav svg{width:16px;height:16px}
.nav .count{font-family:var(--num);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.dots{display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(236,230,218,.22);cursor:pointer}
.dots i.on{background:var(--net);width:18px;border-radius:3px}
@media (max-width:700px){.dots{display:none}}

/* ---------- dashboard ---------- */
.dash{min-height:100%;background:
   linear-gradient(to bottom,rgba(15,19,20,.55),var(--ink) 520px),
   var(--dash-poster, none) center top/cover no-repeat, var(--ink)}
.dash[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:96px 80px}
.d-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.d-hero h1{font-family:var(--display);font-size:clamp(30px,4vw,46px);line-height:1.08;margin:8px 0 0;text-wrap:balance}
.d-hero p{color:#d3cdc1;font-size:17px;max-width:62ch;margin:14px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin-top:34px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  background:rgba(15,19,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink-3);color:var(--paper)}
.panel{padding-top:28px}
.panel[hidden]{display:none!important}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 16px}
.sec-h h2{font-family:var(--display);font-size:28px;margin:0}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.grid2,.d-hero{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.dc{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.dc .lbl{font-size:13px;color:var(--muted);font-weight:600}
.dc .v{font-family:var(--num);font-size:30px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.dc .s{font-family:var(--num);font-size:13px;color:var(--faint)}
.note{background:linear-gradient(to right,rgba(217,171,79,.10),rgba(217,171,79,.02));border:1px solid rgba(217,171,79,.25);border-radius:14px;padding:16px 18px;color:#e2dccf;font-size:15px;line-height:1.65;margin-top:16px}
.note b{color:var(--net)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--ink-3);position:sticky;top:0}
td:first-child,th:first-child{text-align:left;white-space:normal;min-width:280px}
td.num{font-family:var(--num);font-variant-numeric:tabular-nums}
tr.group td{font-weight:700;background:rgba(236,230,218,.035)}
tr.net td{font-weight:700;color:var(--net)}
tr.bal td{font-weight:700;background:rgba(127,167,201,.08)}
tr.sum td{font-weight:700;border-top:2px solid rgba(236,230,218,.25)}
td .code{font-family:var(--body);font-size:12px;color:var(--faint);margin-left:6px}
td.neg{color:var(--out)} td.pos{color:var(--in)}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:inline-block;height:8px;border-radius:4px;background:var(--info);opacity:.7}
.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cg{grid-template-columns:1fr}}
.cc{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.cc .code{font-family:var(--num);font-size:12px;color:var(--net);font-weight:600;letter-spacing:.04em}
.cc h3{margin:2px 0 0;font-size:16px;line-height:1.35}
.cc .fx{font-family:var(--display);font-size:20px;padding:10px 0;color:#efe9de;overflow-x:auto}
.cc .calc{font-family:var(--num);font-size:13px;color:#cfc9bd;background:var(--ink-3);border-radius:10px;padding:10px 12px;line-height:1.7;overflow-x:auto;white-space:nowrap}
.cc .calc b{color:var(--paper)}
.cc .simple{font-size:14px;color:#d3cdc1;line-height:1.6}
.cc .vals{display:flex;gap:18px;align-items:baseline;font-family:var(--num)}
.cc .vals .y{font-size:12px;color:var(--faint);display:block}
.cc .vals .x{font-size:22px;font-weight:600}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gloss{grid-template-columns:1fr}}
.gloss div{background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gloss b{font-family:var(--display);font-size:17px}
.gloss p{margin:6px 0 0;font-size:14px;color:#cfc9bd}
.chart-card{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.chart-card h3{margin:0 0 10px;font-size:15px}
.chart-card .chart-box{height:300px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sum-list{display:grid;gap:12px}
.sum-list div{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sum-list b{display:block;font-family:var(--display);font-size:17px;margin-bottom:4px}
.sum-list p{margin:0;color:#d3cdc1;font-size:14.5px;line-height:1.65}
footer.df{margin-top:40px;color:var(--faint);font-size:13px;border-top:1px solid var(--line);padding-top:18px}

/* own charts */
.ch{width:100%;height:100%;position:relative}
.ch svg{display:block;overflow:visible}
.ch .gr{transform-box:fill-box;transform:scaleY(0)}
.ch.go .gr{animation:gry 1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes gry{to{transform:scaleY(1)}}
.ch .fd{opacity:0}
.ch.go .fd{animation:fdi .6s ease forwards}
@keyframes fdi{to{opacity:1}}
.hb{display:flex;flex-direction:column;gap:9px;overflow:auto}
.hb-leg{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.hb-leg span{display:inline-flex;gap:6px;align-items:center}.hb-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hb-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) auto;gap:12px;align-items:center}
.hb-l{font-size:13px;line-height:1.3;color:#d6d0c4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hb-t{display:flex;flex-direction:column;gap:3px}
.hb-t i{display:block;height:8px;border-radius:4px;transform-origin:left;transform:scaleX(0);width:calc(var(--w)*100%);min-width:2px}
.hb-t .b0{background:rgba(167,161,150,.5)}
.ch.go .hb-t i{animation:grx 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d)}
.ch.go .hb-row:nth-child(n) .b1{animation-delay:calc(var(--d) + 120ms)}
@keyframes grx{to{transform:scaleX(1)}}
.hb-row{--d:0ms}

function ringSVG(val, base, color, id, dec=0, cap='2025'){

  return `<svg viewBox="0 0 220 220"><defs><linearGradient id="rg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".55"/></linearGradient></defs>

    <text x="110" y="104" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="${dec?36:(Math.abs(val)>=1e7?24:30)}" fill="${G.text}" data-count="${val}" data-dec="${dec}">${fmt(val,dec)}</text>

}
/* bridge (waterfall) in HTML: start, +in, −out, =end */
function bridge(vals, labels, colors, h=430){
  const mx = Math.max(vals[0]+vals[1], vals[3]) * 1.08; let run = 0;
  return `<div class="bridge" style="--h:${h}px">${vals.map((x,i)=>{
    let lo, hi; if (i===0){ lo=0; hi=x; run=x; } else if (i===1){ lo=run; hi=run+x; run=hi; } else if (i===2){ hi=run; lo=run-x; run=lo; } else { lo=0; hi=x; }
    return `<div class="bc" style="--i:${i}"><div class="bv">${i===1?'+':(i===2?'−':'')}${fmt(x)}</div><div class="bt"><i style="bottom:${(lo/mx*100).toFixed(2)}%;height:${((hi-lo)/mx*100).toFixed(2)}%;--c:${colors[i]}"></i></div><div class="bl">${labels[i]}</div></div>`; }).join('')}</div>`;

   <div class="plg"><span><i style="background:${ca}"></i>2024</span><span><i style="background:${cb}"></i>2025</span></div>`;

function donutSVG(parts, cols, label, sub){
  const tot = parts.reduce((s,p)=>s+p.v,0); let a0 = -90; const R = 120, r = 74;

    const [x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r),[x3,y3]=P(a0,r);
    const d = `M${x0} ${y0} A${R} ${R} 0 ${L} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${L} 0 ${x3} ${y3}Z`; a0 = a1 + .6;
    return `<path class="dseg" style="--i:${i}" d="${d}" fill="${cols[i%cols.length]}"><title>${esc(p.n)}: ${fmt(p.v)}</title></path>`; }).join('');
  return `<svg viewBox="0 0 300 300" class="donut">${seg}<text x="150" y="146" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="700" fill="${G.text}">${label}</text><text x="150" y="174" text-anchor="middle" font-size="15" fill="${G.sub}" font-family="Noto Sans Armenian, sans-serif">${sub}</text></svg>`;
}

  return `<svg viewBox="0 0 220 220" class="clock">${ticks}<circle cx="110" cy="110" r="${R}" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
    <circle class="arc" cx="110" cy="110" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C*(1-a/360)}" style="filter:drop-shadow(0 0 10px ${color})"/>

$('#dr-dl').onclick = async () => {
  const b = $('#dr-dl'); const bin = atob(XLSX_B64); const u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);

}; $('#b-xl').onclick = e => { e.stopPropagation(); openXL(); };

/* preloader: waits for images + first video (max 9s), shows real progress */
function preload(){
  const pl = $('#pl'); if (!pl) return Promise.resolve();
  const list = [...new Set(Object.values(IMG))].map(u => ({u, t:'img'})).concat(Object.values(VID).map(u => ({u, t:'vid'})));
  let done = 0; const arc = $('#pl-arc'), pct = $('#pl-pct');
  const tick = () => { done++; const p = done / list.length; arc.style.strokeDashoffset = (326.7*(1-p)).toFixed(1); pct.textContent = Math.round(p*100) + '%'; };
  const one = a => new Promise(res => {
    let fin = false; const ok = () => { if (fin) return; fin = true; tick(); res(); };
    if (a.t === 'img'){ const im = new Image(); im.onload = im.onerror = ok; im.decoding = 'async'; im.src = a.u; if (im.complete) ok(); }
    else { const v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.onloadeddata = v.onerror = ok; v.src = a.u; v.load(); setTimeout(ok, 6000); }
  });
  return Promise.race([Promise.all(list.map(one)), new Promise(r => setTimeout(r, 9000))]).then(() => {
    arc.style.strokeDashoffset = 0; pct.textContent = '100%'; $('#pl-s').textContent = 'Պատրաստ է';
    return new Promise(r => setTimeout(() => { pl.classList.add('bye'); setTimeout(() => pl.remove(), 900); r(); }, 250));
  });
}

/* boot */
(function(){
  preload();
  const h = location.hash, m = /^#s(\d+)$/.exec(h);
  xgo(m ? Math.min(SL.length, +m[1]) - 1 : 0);
  document.body.style.overflow = 'hidden';
  if (h === '#excel') openXL();
  idleT = setTimeout(()=>xapp.classList.add('idle'), 4000);
})();
